<svg width="640" height="640" viewBox="0 0 640 640" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">ChopWala logo</title>
  <desc id="desc">Premium orange and gold ChopWala Bengali street food logo with a crispy chop mascot.</desc>
  <defs>
